<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Shop dresses, shoes, bags and accessories in Malawi kwacha.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mary’s Fashion">
  <link rel="apple-touch-icon" href="icons/nyasa-threads-app.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="marysfashion-icon.png?v=1"/>

  <title>Mary’s Fashion | marysfashion</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://ywuhtffhqbjxaslbwotn.supabase.co" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <style>
    html, body { height: 100%; margin: 0; background: #f7f7f2; }
    .app-loading {
      position: fixed; inset: 0; display: grid; place-content: center; gap: 16px;
      color: #264d3d; font: 600 16px system-ui, sans-serif; text-align: center;
    }
    .app-loading__spinner {
      width: 34px; height: 34px; margin: auto; border: 3px solid #d5dbd2;
      border-top-color: #264d3d; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <script>
    (async () => {
      if (!('serviceWorker' in navigator)) return;
      const registrations = await navigator.serviceWorker.getRegistrations();
      const cacheNames = 'caches' in window ? await caches.keys() : [];
      if (registrations.length === 0 && cacheNames.length === 0) return;
      await Promise.all([
        ...registrations.map((registration) => registration.unregister()),
        ...cacheNames.map((name) => caches.delete(name)),
      ]);
      if (!sessionStorage.getItem('marysfashion-cache-reset')) {
        sessionStorage.setItem('marysfashion-cache-reset', '1');
        location.reload();
      }
    })();
  </script>
  <div class="app-loading" aria-live="polite" aria-label="Loading Mary Inventory">
    <div class="app-loading__spinner" aria-hidden="true"></div>
    <div>Loading Mary Inventory…</div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
