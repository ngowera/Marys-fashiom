name: Deploy Marys Fashion website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: apps/marys_fashion_website
        run: flutter pub get

      - name: Build customer website
        working-directory: apps/marys_fashion_website
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: >-
          flutter build web
          --release
          --base-href "/"
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Install inventory dependencies
        run: flutter pub get

      - name: Build inventory website
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: >-
          flutter build web
          --release
          --target lib/main_inventory.dart
          --output build/inventory
          --base-href "/inventory/"
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Add inventory to Pages artifact
        run: |
          mkdir -p apps/marys_fashion_website/build/web/inventory
          cp -a build/inventory/. apps/marys_fashion_website/build/web/inventory/

      - name: Prevent Jekyll processing
        run: |
          touch apps/marys_fashion_website/build/web/.nojekyll
          echo "marysfashion.afrisoft.store" > apps/marys_fashion_website/build/web/CNAME

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/marys_fashion_website/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
